<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avalon Trip Log</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --bg: #ffffff; --fg: #1d2330; --muted: #5d6677; --border: #d9dee7;
      --route: #1f6feb; --stop: #d1242f; --latest: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161b22; --fg: #e6edf3; --muted: #9aa5b4; --border: #30363d; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    #map { position: absolute; inset: 0; }
    #panel { position: absolute; z-index: 1000; top: 12px; left: 56px; max-width: min(340px, calc(100% - 72px));
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.15); }
    #panel h1 { font-size: 16px; margin: 0 0 2px; }
    #panel .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    #panel dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
    #panel dt { color: var(--muted); }
    #panel dd { margin: 0; font-variant-numeric: tabular-nums; }
    #legend { margin-top: 8px; color: var(--muted); font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; }
    #legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      margin-right: 4px; vertical-align: -1px; background: var(--c); }
    .leaflet-popup-content { font-size: 13px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h1>Avalon</h1>
    <div class="sub">Motor yacht · MMSI 244000052</div>
    <dl id="stats"><dt>Status</dt><dd>Loading…</dd></dl>
    <div id="legend">
      <span style="--c: var(--latest)">Latest</span>
      <span style="--c: var(--stop)">Stop (over 1 h)</span>
      <span style="--c: var(--route)">Route</span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="assets/track.js"></script>
  <script>
    const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const fmt = (d) => d.toLocaleString(undefined, { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", timeZoneName: "short" });
    const duration = (minutes) => {
      const h = Math.floor(minutes / 60), d = Math.floor(h / 24);
      return d ? `${d} d ${h % 24} h` : `${h} h ${Math.round(minutes % 60)} min`;
    };

    const map = L.map("map", { worldCopyJump: true }).setView([45, 5], 4);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · AIS via aisstream.io',
    }).addTo(map);

    function setStats(entries) {
      document.getElementById("stats").innerHTML =
        entries.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    }

    fetch(`data/positions.csv?t=${Date.now()}`)
      .then((r) => (r.ok ? r.text() : ""))
      .catch(() => "")
      .then((text) => {
        const points = Track.parseCsv(text);
        if (!points.length) {
          setStats([["Status", "No positions logged yet. The log fills in as Avalon is picked up by AIS receivers."]]);
          return;
        }

        for (const leg of Track.legs(points)) {
          L.polyline(leg.points.map((p) => [p.lat, p.lon]), {
            color: css("--route"), weight: leg.gap ? 2 : 3, opacity: leg.gap ? 0.6 : 0.9,
            dashArray: leg.gap ? "6 8" : null,
          }).addTo(map);
        }

        const stops = Track.findStops(points);
        for (const s of stops) {
          L.circleMarker([s.lat, s.lon], {
            radius: 7, color: "#fff", weight: 2, fillColor: css("--stop"), fillOpacity: 1,
          }).bindPopup(
            `<b>Stop</b><br>Arrived ${fmt(s.arrived)}<br>` +
            (s.ongoing ? `Still here as of ${fmt(s.departed)}` : `Left ${fmt(s.departed)}`) +
            `<br>Duration ${duration(s.minutes)}`
          ).addTo(map);
        }

        const last = points[points.length - 1];
        const speed = last.sog == null ? "unknown" : `${last.sog.toFixed(1)} kn`;
        const course = last.cog == null ? "unknown" : `${Math.round(last.cog)}°`;
        L.circleMarker([last.lat, last.lon], {
          radius: 9, color: "#fff", weight: 3, fillColor: css("--latest"), fillOpacity: 1,
        }).bindPopup(`<b>Latest position</b><br>${fmt(last.time)}<br>Speed ${speed}, course ${course}`)
          .addTo(map).openPopup();

        if (points.length > 1) {
          map.fitBounds(L.latLngBounds(points.map((p) => [p.lat, p.lon])).pad(0.15), { maxZoom: 13 });
        } else {
          map.setView([last.lat, last.lon], 12);
        }

        setStats([
          ["Last seen", fmt(last.time)],
          ["Position", `${last.lat.toFixed(4)}, ${last.lon.toFixed(4)}`],
          ["Speed", speed],
          ["Logged since", fmt(points[0].time)],
          ["Distance", `${Math.round(Track.distanceNm(points)).toLocaleString()} nm`],
          ["Stops", stops.length],
        ]);
      });
  </script>
</body>
</html>
